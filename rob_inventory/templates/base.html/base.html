<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROB Autoparts - Sistema de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">ROB AUTOPARTS</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link text-white" href="/">Inventario</a>
                <a class="nav-link text-white" href="/ventas">Historial de Ventas</a>
            </div>
            {% if current_user.is_authenticated %}
                <div class="d-flex align-items-center gap-3">
                    <span class="text-light small">👤 Usuario: <strong>{{ current_user.username }}</strong></span>
                    <a href="/logout" class="btn btn-outline-danger btn-sm">Cerrar Sesión</a>
                </div>
            {% endif %}
        </div>
    </nav>
    <div class="container mb-5">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
